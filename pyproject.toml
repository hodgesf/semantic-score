[project]
name = "semantic-score"
version = "1.0.0"
description = "Semantic genericness scoring for knowledge-graph drug repurposing"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "manuscript/frontiers_template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ANN", "D", "UP", "B"]
ignore = ["D203", "D213", "D401", "D417", "ANN401", "E731", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"
